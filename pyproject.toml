[project]
authors = [
    { name = "Tim Hochberg", email = "bitsofbits@users.noreply.github.com" },
]
name = "pyseas"
requires-python = ">= 3.11"
version = "0.10.0"
dependencies = [
    "cartopy>=0.24.1,<0.25",
    "cmocean>=4.0.3,<5",
    "haversine>=2.9.0,<3",
    "jupytext>=1.17.2,<2",
    "jupyter>=1.1.1,<2",
    "matplotlib>=3.10.3,<4",
    "pandas>=2.3.0,<3",
    "pandas-gbq>=0.29.1,<0.30",
    "scikit-image>=0.25.2,<0.26",
    "google-cloud-bigquery>=3.34.0,<4",
    "geopandas>=1.1.1,<2",
    "geos>=0.2.3,<0.3",
    "h3>=4.3.0,<5",
    "gcsfs>=2025.5.1,<2026",
    "rasterio>=1.4.4,<2",
]

[tool.setuptools.package-data]
"pyseas" = ["data/eezs/*", "data/fonts/*", "data/logos/*"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]
